<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Error</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #000;
      color: #ededed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      text-align: center;
      max-width: 580px;
      width: 100%;
    }

    .code {
      font-size: 14px;
      font-weight: 600;
      color: #666;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 20px;
      color: #ededed;
    }

    .details {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .details code {
      background: #1a1a1a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      font-size: 13px;
      color: #999;
    }

    .button {
      display: inline-block;
      padding: 10px 20px;
      border: 1px solid #333;
      border-radius: 6px;
      color: #ededed;
      text-decoration: none;
      font-size: 14px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .button:hover {
      background-color: #111;
      border-color: #555;
    }

    hr {
      border: none;
      border-top: 1px solid #222;
      margin: 24px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">500</div>
    <h1>Application Error</h1>
    <p class="details">
      This page has crashed unexpectedly.<br>
      If this keeps happening, please contact the site owner.
    </p>
    <hr>
    <a href="/" class="button">Try Again</a>
  </div>
</body>
</html>
